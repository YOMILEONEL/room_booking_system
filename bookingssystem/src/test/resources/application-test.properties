spring.datasource.url=jdbc:h2:mem:bookingssystem;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

spring.flyway.enabled=false

security.jwt.secret=test-only-secret-key-not-for-production-use-0123456789
security.jwt.issuer=bookingssystem-test
security.jwt.accessTokenTtlMinutes=60
security.jwt.refreshTokenTtlDays=30
security.jwt.passwordResetTokenTtlMinutes=30
