spring.application.name=bookingssystem

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookingssystem}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
# Defaults to off: logging every SQL statement (incl. bind values for simple cases) is a dev/debug
# aid, not something a production deployment should do by default (docs/code-review.md, 2.9).
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# Comma-separated list of frontend origins allowed to call this API (docs/code-review.md, 2.4).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Per-IP throttling for /api/login, /api/register, /api/forgot-password (docs/code-review.md, 2.7).
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

security.jwt.secret=${SECURITY_JWT_SECRET}
security.jwt.issuer=${SECURITY_JWT_ISSUER:bookingssystem}
security.jwt.accessTokenTtlMinutes=${SECURITY_JWT_ACCESSTOKENTTLMINUTES:60}
security.jwt.refreshTokenTtlDays=${SECURITY_JWT_REFRESHTOKENTTLDAYS:30}
security.jwt.passwordResetTokenTtlMinutes=${SECURITY_JWT_PASSWORDRESETTOKENTTLMINUTES:30}

# Logging the raw reset token lets anyone with log access (Docker logs, hosting dashboard,
# a screenshot) take over any account within its validity window - see docs/code-review.md, 2.1.
# Defaults to off; only enable this as a stand-in for real email delivery, which this project
# doesn't have yet (no SMTP/Resend credentials configured).
app.password-reset.log-token=${APP_LOG_PASSWORD_RESET_TOKENS:false}

# Optional: only needed for the room-photo-upload feature. Left blank (not required) so the
# app still starts and works normally before this is configured - StorageServiceImpl reports a
# clear error only if someone actually tries to upload without it set up.
supabase.url=${SUPABASE_URL:}
supabase.storage.endpoint=${SUPABASE_S3_ENDPOINT:}
supabase.storage.region=${SUPABASE_S3_REGION:}
supabase.storage.bucket=${SUPABASE_S3_BUCKET:}
supabase.storage.access-key=${SUPABASE_S3_ACCESS_KEY:}
supabase.storage.secret-key=${SUPABASE_S3_SECRET_KEY:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
