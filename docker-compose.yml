services:
  mysql:
    image: mysql:8
    container_name: booking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      MYSQL_DATABASE: bookingssystem
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./bookingssystem
    container_name: booking-backend
    restart: unless-stopped
    env_file:
      - ./bookingssystem/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/bookingssystem
      SPRING_DATASOURCE_USERNAME: root
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./react_frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
    container_name: booking-frontend
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
