services:


  backend:
    build: ./bookingssystem
    container_name: booking-backend
    restart: "no"
  
    env_file:
      - ./bookingssystem/.env
    environment:
      
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      
      APP_LOG_PASSWORD_RESET_TOKENS: "true"
      
      LOKI_URL: ${LOKI_URL:-http://loki:3100/loki/api/v1/push}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./react_frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8080}
    container_name: booking-frontend
    restart: "no"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in .env}
      
      BACKEND_INTERNAL_URL: http://backend:8080
      
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"


  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: booking-prometheus
    restart: "no"
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  loki:
    image: grafana/loki:3.7.8
    container_name: booking-loki
    restart: "no"
    profiles: ["monitoring"]
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:13.2.2
    container_name: booking-grafana
    restart: "no"
    profiles: ["monitoring"]
    environment:
      # Change this (or set GRAFANA_ADMIN_PASSWORD in .env) before using this anywhere reachable
      # beyond your own machine - "admin" is a public default.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
